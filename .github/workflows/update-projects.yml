name: Update projects table

# The 主要项目 table mirrors each repo's Description. Rewriting it by hand went
# stale within minutes of a description change, so it is generated instead.
on:
  schedule:
    - cron: "20 18 * * *"  # 每天 18:20 UTC = 凌晨 2:20 北京时间（错开 3D 贡献图）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate the projects table
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_projects.py

      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "projects table already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: sync projects table from repo descriptions [skip ci]"
          git push
